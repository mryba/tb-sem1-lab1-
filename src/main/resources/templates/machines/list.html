<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maszyny</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="mb-1">Maszyny</h1>
            <p class="text-secondary mb-0">Lista maszyn zapisanych w bazie SQLite.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/machines/new}">Dodaj maszynę</a>
    </div>

    <div th:if="${message}" class="alert alert-success" role="alert" th:text="${message}"></div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Nazwa</th>
                    <th>Data uruchomienia</th>
                    <th>Status</th>
                    <th class="text-end">Akcje</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${machines.empty}">
                    <td colspan="4" class="text-center text-secondary py-4">Brak maszyn.</td>
                </tr>
                <tr th:each="machine : ${machines}">
                    <td th:text="${machine.name}"></td>
                    <td th:text="${#temporals.format(machine.launchDate, 'yyyy-MM-dd HH:mm')}"></td>
                    <td>
                        <span th:if="${machine.operational}" class="badge text-bg-success">Operacyjna</span>
                        <span th:unless="${machine.operational}" class="badge text-bg-secondary">Nieoperacyjna</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/machines/{id}/edit(id=${machine.id})}">Edytuj</a>
                        <form class="d-inline" method="post" th:action="@{/machines/{id}/delete(id=${machine.id})}">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Usuń</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
