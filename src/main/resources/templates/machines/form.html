<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${formTitle}">Maszyna</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 720px">
    <div class="mb-4">
        <a class="text-decoration-none" th:href="@{/machines}">&larr; Wróć do listy</a>
        <h1 class="mt-3" th:text="${formTitle}">Maszyna</h1>
    </div>

    <form class="card card-body shadow-sm" method="post"
          th:object="${machine}"
          th:action="${machine.id == null} ? @{/machines} : @{/machines/{id}(id=${machine.id})}">
        <div class="mb-3">
            <label class="form-label" for="name">Nazwa maszyny</label>
            <input class="form-control" id="name" type="text" th:field="*{name}" autofocus>
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="launchDate">Data uruchomienia</label>
            <input class="form-control" id="launchDate" type="datetime-local"
                   th:field="*{launchDate}">
            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('launchDate')}" th:errors="*{launchDate}"></div>
        </div>

        <div class="form-check mb-4">
            <input class="form-check-input" id="operational" type="checkbox" th:field="*{operational}">
            <label class="form-check-label" for="operational">Maszyna operacyjna</label>
        </div>

        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Zapisz</button>
            <a class="btn btn-outline-secondary" th:href="@{/machines}">Anuluj</a>
        </div>
    </form>
</main>
</body>
</html>
